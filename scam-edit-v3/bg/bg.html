<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
const cv=document.getElementById('c'), g=cv.getContext('2d');
const W=1920,H=1080,LOOP=20, TAU=Math.PI*2;
let s=12345; const rnd=()=>{s=(s*1664525+1013904223)%4294967296;return s/4294967296;};
const P=[];                       // bokeh particles (periodic motion -> seamless loop)
for(let i=0;i<46;i++){const big=rnd()<0.28;P.push({x:rnd()*W,y:rnd()*(H+160),r:big?14+rnd()*30:3+rnd()*9,a:big?0.05+rnd()*0.08:0.10+rnd()*0.22,
  k:big?1:(rnd()<0.5?1:2),ph:rnd()*TAU,sw:10+rnd()*34,hue:rnd()<0.7?[70,160,255]:(rnd()<0.5?[120,225,255]:[255,255,255])});}
const HEX=64;                      // hex grid
function glow(cx,cy,r,col,a){const gr=g.createRadialGradient(cx,cy,0,cx,cy,r);gr.addColorStop(0,`rgba(${col},${a})`);gr.addColorStop(0.55,`rgba(${col},${a*0.35})`);gr.addColorStop(1,`rgba(${col},0)`);g.fillStyle=gr;g.fillRect(cx-r,cy-r,2*r,2*r);}
function hexPath(cx,cy,r){g.moveTo(cx+r,cy);for(let i=1;i<6;i++)g.lineTo(cx+r*Math.cos(i*TAU/6),cy+r*Math.sin(i*TAU/6));g.closePath();}
window.draw=function(i){
  const t=i/30, u=(t%LOOP)/LOOP;
  g.globalCompositeOperation='source-over';
  const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#030a1e');bg.addColorStop(1,'#020611');g.fillStyle=bg;g.fillRect(0,0,W,H);
  g.globalCompositeOperation='lighter';
  const pl=1+0.05*Math.sin(TAU*u*2);
  glow(1340,400,820*pl,'28,110,255',0.58);        // light behind the speaker (separates dark hair from the wall)
  glow(1560,250,420,'90,190,255',0.22);
  glow(300,760,700,'20,70,190',0.34);
  glow(180,120,520,'0,190,255',0.10);
  // slow light beams
  for(let b=0;b<3;b++){
    const ang=(-0.30+b*0.22)+0.035*Math.sin(TAU*(u*2+b/3));
    g.save();g.translate(420+b*560,-80);g.rotate(ang);
    const gr=g.createLinearGradient(-110,0,110,0);gr.addColorStop(0,'rgba(80,160,255,0)');gr.addColorStop(0.5,`rgba(110,185,255,${0.055+0.02*Math.sin(TAU*(u*2+b*0.33))})`);gr.addColorStop(1,'rgba(80,160,255,0)');
    g.fillStyle=gr;g.fillRect(-110,0,220,1400);g.restore();
  }
  // hex grid with a travelling highlight
  g.lineWidth=1.4;
  const dx=HEX*1.5, dy=HEX*Math.sqrt(3)/2;
  for(let col=-1;col<W/dx+2;col++){for(let row=-1;row<H/dy+2;row++){
    const cx=col*dx, cy=row*dy*2+(col%2?dy:0);
    const band=Math.sin(TAU*(u*2-(cx*0.55+cy*0.35)/2600));       // diagonal wave
    const a=0.030+0.060*Math.max(0,band)**3;
    g.strokeStyle=`rgba(110,190,255,${a})`;g.beginPath();hexPath(cx,cy,HEX-3);g.stroke();
  }}
  // bokeh
  for(const p of P){
    const yy=((p.y-(H+160)*p.k*u)%(H+160)+(H+160))%(H+160)-80;
    const xx=p.x+p.sw*Math.sin(TAU*(u*p.k+p.ph/TAU));
    const tw=0.75+0.25*Math.sin(TAU*(u*2*p.k+p.ph));
    const gr=g.createRadialGradient(xx,yy,0,xx,yy,p.r);gr.addColorStop(0,`rgba(${p.hue},${p.a*tw})`);gr.addColorStop(0.7,`rgba(${p.hue},${p.a*tw*0.55})`);gr.addColorStop(1,`rgba(${p.hue},0)`);
    g.fillStyle=gr;g.beginPath();g.arc(xx,yy,p.r,0,TAU);g.fill();
  }
  g.globalCompositeOperation='source-over';
};
window.draw(0);
</script></body></html>
