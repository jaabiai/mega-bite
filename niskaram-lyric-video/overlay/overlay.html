<!doctype html>
<html lang="ml">
<head>
<meta charset="utf-8">
<title>Overlay renderer</title>
<style>
  @font-face { font-family: 'Anek Malayalam'; font-weight: 700; src: url('../fonts/anek-malayalam-malayalam-700-normal.woff2') format('woff2'); unicode-range: U+0D00-0D7F, U+200C-200D, U+25CC; }
  @font-face { font-family: 'Anek Malayalam'; font-weight: 800; src: url('../fonts/anek-malayalam-malayalam-800-normal.woff2') format('woff2'); unicode-range: U+0D00-0D7F, U+200C-200D, U+25CC; }
  @font-face { font-family: 'Anek Malayalam'; font-weight: 700; src: url('../fonts/anek-malayalam-latin-700-normal.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Anek Malayalam'; font-weight: 800; src: url('../fonts/anek-malayalam-latin-800-normal.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Baloo Chettan 2'; font-weight: 800; src: url('../fonts/baloo-chettan-2-malayalam-800-nodotcircle.woff2') format('woff2'); unicode-range: U+0D00-0D7F, U+200C-200D; }
  @font-face { font-family: 'Baloo Chettan 2'; font-weight: 700; src: url('../fonts/baloo-chettan-2-malayalam-700-nodotcircle.woff2') format('woff2'); unicode-range: U+0D00-0D7F, U+200C-200D; }
  @font-face { font-family: 'Noto Serif Malayalam'; font-weight: 800; src: url('../fonts/noto-serif-malayalam-malayalam-800-normal.woff2') format('woff2'); unicode-range: U+0D00-0D7F, U+200C-200D, U+25CC; }
  @font-face { font-family: 'Noto Naskh Arabic'; font-weight: 700; src: url('../fonts/noto-naskh-arabic-arabic-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Amiri'; font-weight: 700; src: url('../fonts/amiri-arabic-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Aref Ruqaa'; font-weight: 700; src: url('../fonts/aref-ruqaa-arabic-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Cinzel'; font-weight: 400; src: url('../fonts/cinzel-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Cinzel'; font-weight: 600; src: url('../fonts/cinzel-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Cinzel'; font-weight: 700; src: url('../fonts/cinzel-latin-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Cormorant Garamond'; font-weight: 500; font-style: italic; src: url('../fonts/cormorant-garamond-latin-500-italic.woff2') format('woff2'); }
  @font-face { font-family: 'Cormorant Garamond'; font-weight: 600; src: url('../fonts/cormorant-garamond-latin-600-normal.woff2') format('woff2'); }

  :root { --gold: #e3bd62; --gold-hi: #fbe9ae; --gold-lo: #b98a2b; --cream: #f6edd6; }
  html, body { margin: 0; background: transparent; }
  #stage { position: relative; width: 1920px; height: 804px; overflow: hidden; background: transparent; }
  .abs { position: absolute; }
  .hidden { opacity: 0; }

  /* ---------- opening / end credit cards ---------- */
  #cardShade { left: 0; top: 0; width: 1920px; height: 804px; opacity: 0;
    background: radial-gradient(ellipse 66% 60% at 50% 50%, rgba(3,5,8,.82) 0%, rgba(3,5,8,.58) 52%, rgba(3,5,8,0) 100%); }
  #credit { left: 0; top: 0; width: 1920px; height: 804px; }
  #credit .label { position: absolute; left: 0; width: 1920px; top: 292px; text-align: center;
    font: 700 34px 'Cinzel', serif; color: #f0c964; white-space: nowrap; text-transform: uppercase;
    filter: drop-shadow(0 2px 10px rgba(0,0,0,.9)); }
  #credit .rule { position: absolute; left: 960px; top: 354px; height: 3px; transform: translateX(-50%); width: 0;
    background: linear-gradient(90deg, rgba(227,189,98,0), var(--gold) 18%, var(--gold-hi) 50%, var(--gold) 82%, rgba(227,189,98,0));
    box-shadow: 0 0 16px rgba(227,189,98,.75); }
  #credit .dia { position: absolute; left: 960px; top: 355px; width: 14px; height: 14px; margin: -7px 0 0 -7px;
    background: var(--gold-hi); transform: rotate(45deg); box-shadow: 0 0 20px rgba(251,233,174,.95); }
  #credit .name { position: absolute; left: 0; width: 1920px; top: 382px; text-align: center; white-space: pre;
    font: 700 104px/1.25 'Cinzel', serif; color: #f6e9c7; text-transform: uppercase; }
  #credit .ch { display: inline-block; white-space: pre; will-change: transform, opacity, filter; }

  /* ---------- Arabic title ---------- */
  #title { left: 0; top: 0; width: 1920px; height: 804px; }
  #titleWrap { position: absolute; left: 960px; top: 402px; display: grid; direction: rtl; white-space: nowrap; transform: translate(-50%, -50%); }
  .tl { grid-area: 1 / 1; padding: 0 44px; font: 700 214px/2.05 'Aref Ruqaa', 'Noto Naskh Arabic', serif; color: transparent; }
  #titleShadow { text-shadow: 0 10px 30px rgba(0,0,0,.75), 0 2px 6px rgba(0,0,0,.6); }
  #titleGlow { text-shadow: 0 0 24px rgba(240,200,110,.55); }
  #titleText { background-image: linear-gradient(180deg, #fff8dc 0%, #f6dc8e 30%, #d9a843 62%, #f3d98a 100%);
    -webkit-background-clip: text; background-clip: text; }
  #titleSheen { background-image: linear-gradient(105deg, rgba(255,255,255,0) 35%, rgba(255,255,255,.95) 50%, rgba(255,255,255,0) 65%);
    background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; mix-blend-mode: screen; }
  #pen { position: absolute; top: 250px; width: 120px; height: 300px; margin-left: -60px;
    background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(255,243,200,.95), rgba(240,200,110,.45) 40%, rgba(240,200,110,0) 72%); filter: blur(5px); }
  #lightLine { position: absolute; left: 960px; top: 401px; height: 3px; transform: translateX(-50%); width: 0;
    background: linear-gradient(90deg, rgba(255,240,190,0), #fff3c4 25%, #ffffff 50%, #fff3c4 75%, rgba(255,240,190,0));
    box-shadow: 0 0 22px 4px rgba(240,200,110,.7); }
  #orn { position: absolute; left: 0; top: 0; width: 1920px; height: 804px; }
  #particles { position: absolute; left: 0; top: 0; }

  /* ---------- lyric lower-third: ONE sung word (or a short two-word chunk) at a time + neon underline ---------- */
  #lt { left: 0; top: 0; width: 1920px; height: 804px; }
  #ltPlate { position: absolute; left: 0; bottom: 0; width: 1500px; height: 400px; transform-origin: 0 100%;
    background: linear-gradient(90deg, rgba(4,6,9,.72) 0%, rgba(4,6,9,.46) 52%, rgba(4,6,9,0) 100%);
    -webkit-mask-image: linear-gradient(0deg, #000 0%, #000 55%, transparent 100%); mask-image: linear-gradient(0deg, #000 0%, #000 55%, transparent 100%); }
  .cap { position: absolute; left: 134px; top: 0; height: 804px; display: none; }
  .cap .t { position: absolute; left: 0; bottom: 122px; white-space: nowrap; color: #fff; transform-origin: 0 80%;
    font: 800 var(--capSize, 112px)/1.22 var(--capFont, 'Baloo Chettan 2'), 'Anek Malayalam', sans-serif; will-change: transform, opacity, filter; }
  .cap .t.ar { font-family: 'Amiri', 'Noto Naskh Arabic', var(--capFont, 'Baloo Chettan 2'), serif; font-weight: 700; font-size: calc(var(--capSize, 112px) * 1.12); line-height: 1.3; }
  .cap .t .arw { display: inline-block; unicode-bidi: isolate; direction: rtl; font-family: 'Amiri', 'Noto Naskh Arabic', serif; font-weight: 700; font-size: 1.08em; line-height: 1; margin-right: .14em; }
  .cap .u { position: absolute; left: -8px; bottom: 96px; height: 8px; will-change: opacity; }
  /* neon tube: dark glass tube, a white-hot core that travels along it with a comet tail, and a wide amber bloom */
  .cap .u .track { position: absolute; inset: 0; border-radius: 5px; background: rgba(255,200,90,.14); box-shadow: 0 0 8px rgba(255,170,50,.28), inset 0 0 3px rgba(255,230,170,.25); }
  .cap .u .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 5px;
    background: linear-gradient(90deg, rgba(255,150,30,.55) 0%, #ffb02e 22%, #ffd978 62%, #fff4cc 90%, #ffffff 100%);
    box-shadow: 0 0 3px #fff, 0 0 9px #ffe08a, 0 0 20px #ffb62e, 0 0 42px rgba(255,150,20,.8), 0 0 86px rgba(255,120,0,.5); }
  .cap .u .fill::after { content: ''; position: absolute; left: 0; right: 0; top: -8px; bottom: -8px; border-radius: 12px; background: linear-gradient(90deg, rgba(255,140,20,0), rgba(255,170,40,.9)); filter: blur(11px); opacity: .75; }
  .cap .u .head { position: absolute; top: 50%; width: 84px; height: 84px; margin: -42px 0 0 -42px; border-radius: 50%; left: 0;
    background: radial-gradient(circle, rgba(255,255,245,1) 0%, rgba(255,236,160,.85) 18%, rgba(255,176,46,.45) 42%, rgba(255,140,20,0) 72%); }
  .cap .u .head::before { content: ''; position: absolute; left: -90px; right: -90px; top: 50%; height: 3px; margin-top: -1.5px; border-radius: 2px;
    background: linear-gradient(90deg, rgba(255,230,160,0), rgba(255,250,225,.95) 50%, rgba(255,230,160,0)); filter: blur(.6px); }

  /* ---------- end credits ---------- */
  #endShade { left: 0; top: 0; width: 1920px; height: 804px; opacity: 0;
    background: linear-gradient(270deg, rgba(3,5,8,.82) 0%, rgba(3,5,8,.62) 32%, rgba(3,5,8,0) 62%); }
  .eItem { position: absolute; right: 150px; text-align: right; white-space: nowrap; }
  .eItem .l { font: 600 19px 'Cinzel', serif; letter-spacing: .5em; color: var(--gold); text-transform: uppercase; margin-right: -.5em; filter: drop-shadow(0 2px 6px rgba(0,0,0,.8)); }
  .eItem .n { font: 600 40px 'Cinzel', serif; letter-spacing: .14em; color: #f4ead0; margin-top: 8px; margin-right: -.14em; filter: drop-shadow(0 2px 10px rgba(0,0,0,.8)); }
  #endLogo { left: 960px; top: 372px; width: 380px; height: 380px; margin: -190px 0 0 -190px; }
  #endLogo img { width: 380px; height: 380px; display: block; filter: drop-shadow(0 0 40px rgba(227,189,98,.35)) drop-shadow(0 10px 30px rgba(0,0,0,.6)); }
  #thanks { left: 0; width: 1920px; top: 612px; text-align: center; font: italic 500 36px 'Cormorant Garamond', serif; letter-spacing: .06em; color: var(--gold-hi);
    filter: drop-shadow(0 2px 10px rgba(0,0,0,.85)); }
</style>
</head>
<body>
<div id="stage">
  <div id="cardShade" class="abs"></div>

  <div id="credit" class="abs">
    <div class="label"></div><div class="rule"></div><div class="dia"></div><div class="name"></div>
  </div>

  <div id="title" class="abs">
    <div id="lightLine"></div>
    <svg id="orn" viewBox="0 0 1920 804" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gl" x1="0" x2="1" y1="0" y2="0">
          <stop offset="0" stop-color="#e3bd62" stop-opacity="0"/><stop offset=".5" stop-color="#fbe9ae"/><stop offset="1" stop-color="#e3bd62" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="glR" x1="1" x2="0" y1="0" y2="0">
          <stop offset="0" stop-color="#e3bd62" stop-opacity="0"/><stop offset=".5" stop-color="#fbe9ae"/><stop offset="1" stop-color="#e3bd62" stop-opacity="0"/>
        </linearGradient>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <g id="ornTop" filter="url(#glow)" fill="none" stroke="#f3d98a" stroke-width="2.4" stroke-linejoin="round">
        <rect id="sqA" x="-26" y="-26" width="52" height="52"/>
        <rect id="sqB" x="-26" y="-26" width="52" height="52"/>
        <circle id="cc" r="7" fill="#fbe9ae" stroke="none"/>
        <line id="lnL" x1="0" y1="0" x2="0" y2="0" stroke="url(#glR)"/>
        <line id="lnR" x1="0" y1="0" x2="0" y2="0" stroke="url(#gl)"/>
      </g>
      <g id="ornBottom" filter="url(#glow)" fill="none" stroke="#e3bd62" stroke-width="2">
        <line id="blL" stroke="url(#glR)"/><line id="blR" stroke="url(#gl)"/>
        <rect id="bd" x="-6" y="-6" width="12" height="12" fill="#fbe9ae" stroke="none"/>
      </g>
    </svg>
    <div id="titleWrap">
      <div class="tl" id="titleShadow"></div>
      <div class="tl" id="titleGlow"></div>
      <div class="tl" id="titleText"></div>
      <div class="tl" id="titleSheen"></div>
    </div>
    <div id="pen"></div>
    <canvas id="particles" width="1920" height="804"></canvas>
  </div>

  <div id="lt" class="abs">
    <div id="ltPlate"></div>
  </div>

  <div id="endShade" class="abs"></div>
  <div id="endItems" class="abs" style="left:0;top:0;width:1920px;height:804px"></div>
  <div id="endLogo" class="abs"><img id="endLogoImg" src="../inputs/logo_badge.png"></div>
  <div id="thanks" class="abs">Thank you for watching</div>
</div>
<script src="overlay.js"></script>
</body>
</html>
