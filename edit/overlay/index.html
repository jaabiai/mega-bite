<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mega Byte overlay</title>
<style>
@font-face{font-family:Sora;font-weight:800;src:url(../assets/fonts/Sora-800.ttf)}
@font-face{font-family:Sora;font-weight:700;src:url(../assets/fonts/Sora-700.ttf)}
@font-face{font-family:Sora;font-weight:600;src:url(../assets/fonts/Sora-600.ttf)}
@font-face{font-family:Poppins;font-weight:500;src:url(../assets/fonts/Poppins-500.ttf)}
@font-face{font-family:Poppins;font-weight:600;src:url(../assets/fonts/Poppins-600.ttf)}
@font-face{font-family:Poppins;font-weight:700;src:url(../assets/fonts/Poppins-700.ttf)}
@font-face{font-family:Poppins;font-weight:800;src:url(../assets/fonts/Poppins-800.ttf)}

/* "Sunset Amber" theme */
:root{
  --amber:#FFB21F; --amber-hi:#FFD35A; --orange:#FF7A1A; --magenta:#FF2E7E;
  --ink:#0B0D14; --cream:#FFF6E8;
  --grad:linear-gradient(95deg,#FFD35A 0%,#FF9A1F 48%,#FF3D7F 100%);
}
html,body{margin:0;padding:0;background:transparent;width:1920px;height:1080px;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;font-family:Poppins,sans-serif;color:var(--cream)}
.abs{position:absolute}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.sora{font-family:Sora,sans-serif;font-weight:800}
.shadow{filter:drop-shadow(0 4px 14px rgba(0,0,0,.55))}

#scrim{position:absolute;left:0;right:0;bottom:0;height:340px;
  background:linear-gradient(to top,rgba(5,6,12,.82) 0%,rgba(5,6,12,.48) 48%,rgba(5,6,12,0) 100%)}

/* ---------- captions ---------- */
#captions{position:absolute;left:340px;width:1240px;bottom:46px;text-align:center}
.cap{position:absolute;left:0;right:0;bottom:0;display:none}
.cap .line{font:700 52px/1.28 Poppins,sans-serif;letter-spacing:.2px}
.cap .w{display:inline-block;margin:0 .36em;will-change:transform,opacity,filter;
  paint-order:stroke fill;-webkit-text-stroke:5px rgba(6,7,12,.55);text-shadow:0 4px 16px rgba(0,0,0,.6)}

/* ---------- logo ---------- */
#logo{position:absolute;left:1796px;top:26px;width:100px;height:100px;filter:drop-shadow(0 0 14px rgba(40,120,255,.45)) drop-shadow(0 4px 10px rgba(0,0,0,.5))}
#logoHero{position:absolute;display:none;filter:drop-shadow(0 0 30px rgba(40,120,255,.6)) drop-shadow(0 10px 24px rgba(0,0,0,.55))}

/* ---------- hero / badge / kp / chip ---------- */
.kicker{font:700 28px/1 Poppins,sans-serif;letter-spacing:.24em;color:var(--amber);display:flex;align-items:center;gap:14px;text-transform:uppercase;
  text-shadow:0 2px 10px rgba(0,0,0,.6)}
.kicker:before{content:"";display:block;width:46px;height:4px;border-radius:2px;background:var(--grad)}
.hero{left:72px;top:60px;width:900px}
.hero .l{font:800 92px/1.02 Sora,sans-serif;letter-spacing:-1px;color:#fff;text-shadow:0 6px 24px rgba(0,0,0,.55);margin-top:10px;white-space:nowrap}
.hero.small .l{font-size:66px}
.hero .l.g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5))}
.badge{left:72px;top:56px}
.badge .big{font:800 190px/1 Sora,sans-serif;letter-spacing:-4px;filter:drop-shadow(0 8px 26px rgba(0,0,0,.55))}
.kp{width:640px}
.kp .big{font:800 78px/1.0 Sora,sans-serif;letter-spacing:-1px;margin-top:14px;text-transform:uppercase;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5))}
.kp .sub{font:500 28px/1.3 Poppins,sans-serif;color:rgba(255,246,232,.86);margin-top:14px;text-shadow:0 2px 12px rgba(0,0,0,.7)}
.kp .bar{height:5px;border-radius:3px;background:var(--grad);margin-top:18px;transform-origin:left center}
.kp.hero-pos{left:72px;top:64px}
.kp.hero-pos .big{font-size:84px}
.kp.panel-pos{left:70px;top:440px}

/* feature card (screen scenes) */
.fcard{left:70px;top:62px;width:640px}
.fcard .row{display:flex;align-items:center;gap:22px}
.fcard .num{width:104px;height:104px;border-radius:30px;background:var(--grad);color:#1a0f08;display:flex;align-items:center;justify-content:center;
  font:800 56px/1 Sora,sans-serif;box-shadow:0 10px 30px rgba(255,120,30,.35)}
.fcard .t{font:800 54px/1.02 Sora,sans-serif;color:#fff;letter-spacing:-.5px;text-shadow:0 4px 18px rgba(0,0,0,.5)}
.fcard .t.g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.prelabel{left:70px;top:70px;font:600 26px/1 Poppins,sans-serif;letter-spacing:.2em;color:var(--cream)}
.prelabel span{display:inline-block;padding:14px 22px;border-radius:40px;background:rgba(255,178,31,.14);border:1.5px solid rgba(255,178,31,.55)}

/* steps */
.steps{left:1290px;top:392px;width:570px}
.steps .hd{font:600 20px/1 Poppins,sans-serif;letter-spacing:.26em;color:rgba(255,246,232,.55);margin:0 0 14px 6px}
.step{display:flex;align-items:center;gap:16px;height:52px;margin:0 0 4px;padding:0 14px 0 8px;border-radius:30px;border:1.5px solid transparent;
  font:600 25px/1.1 Poppins,sans-serif;white-space:nowrap}
.step .n{flex:none;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 19px/1 Poppins;background:rgba(255,255,255,.12)}
.step svg{width:22px;height:22px}

/* chip (over physical shots) */
.chip{left:72px;top:72px}
.chip .box{display:inline-block;padding:20px 34px 22px 30px;border-radius:26px;background:rgba(10,12,18,.62);border:1.5px solid rgba(255,255,255,.16);
  box-shadow:0 12px 34px rgba(0,0,0,.45);position:relative;overflow:hidden}
.chip .box:before{content:"";position:absolute;left:0;top:0;bottom:0;width:9px;background:var(--grad)}
.chip .big{font:800 62px/1.0 Sora,sans-serif;letter-spacing:-.5px;margin-left:8px;text-transform:uppercase}
.chip .sub{font:500 26px/1.25 Poppins,sans-serif;color:rgba(255,246,232,.85);margin:10px 0 0 8px;max-width:760px}

/* recap */
.recap{left:72px;top:110px}
.rpill{display:flex;align-items:center;gap:22px;width:760px;height:92px;margin-bottom:20px;border-radius:26px;padding:0 30px 0 14px;
  background:rgba(10,12,18,.66);border:1.5px solid rgba(255,255,255,.16);box-shadow:0 12px 34px rgba(0,0,0,.45)}
.rpill .n{width:66px;height:66px;border-radius:20px;background:var(--grad);color:#1a0f08;display:flex;align-items:center;justify-content:center;font:800 32px/1 Sora}
.rpill .t{font:800 38px/1 Sora,sans-serif;letter-spacing:-.3px}

/* CTA widgets */
.cta{left:1380px;top:300px;width:470px}
.btn{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(10,12,18,.72);border:3px solid rgba(255,255,255,.28);box-shadow:0 14px 40px rgba(0,0,0,.5)}
.btn svg{width:56%;height:56%}
.lab{position:absolute;font:800 40px/1 Sora,sans-serif;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 4px 16px rgba(0,0,0,.6)}
.ring{position:absolute;border-radius:50%;border:5px solid var(--amber);opacity:0}
.sub-btn{position:absolute;display:flex;align-items:center;gap:20px;height:118px;border-radius:70px;padding:0 44px 0 30px;font:800 46px/1 Sora,sans-serif;letter-spacing:.04em;
  box-shadow:0 16px 44px rgba(0,0,0,.5)}
.thanks{left:0;right:0;top:80px;text-align:center}
.thanks .tt{display:inline-block;font:800 64px/1 Sora,sans-serif;letter-spacing:.06em;padding:22px 48px;border-radius:60px;background:rgba(10,12,18,.62);border:1.5px solid rgba(255,255,255,.16)}

/* stinger */
.stinger{left:0;top:0;width:1920px;height:1080px}
.stinger .vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 46%,rgba(5,6,12,.15) 0%,rgba(5,6,12,.72) 78%)}
.stinger .words{position:absolute;left:0;right:0;top:640px;text-align:center}
.stinger .wd{display:inline-block;margin:0 .18em;font:800 128px/1 Sora,sans-serif;letter-spacing:-2px;color:#fff;text-shadow:0 8px 30px rgba(0,0,0,.6)}
.stinger .wd.g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 8px 24px rgba(0,0,0,.5))}
.stinger .tag{position:absolute;left:0;right:0;top:812px;text-align:center;font:600 30px/1 Poppins;letter-spacing:.5em;color:var(--amber-hi);text-shadow:0 2px 12px rgba(0,0,0,.7)}
</style>
</head>
<body>
<div id="stage">
  <div id="scrim"></div>
  <div id="layer"></div>
  <div id="captions"></div>
  <img id="logo" src="../assets/logo_megabyte.png">
  <img id="logoHero" src="../assets/logo_megabyte.png">
</div>
<script src="overlay.js"></script>
</body>
</html>
